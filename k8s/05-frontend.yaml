apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edugestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Sustituir por la imagen publicada por el pipeline de CI/CD,
          # p. ej. ghcr.io/<usuario>/edugestion-frontend:<tag>
          image: edugestion-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: edugestion
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
