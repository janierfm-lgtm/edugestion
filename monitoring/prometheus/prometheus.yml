global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API de EduGestión expone métricas en formato Prometheus en /metrics
  # (contador de peticiones HTTP, histograma de duración, métricas por
  # defecto de Node.js: memoria, event loop, garbage collection, etc.)
  - job_name: "edugestion-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]
        labels:
          servicio: "backend-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
