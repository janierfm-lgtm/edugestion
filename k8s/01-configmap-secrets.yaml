# Configuración no sensible del backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: edugestion
data:
  NODE_ENV: "production"
  PORT: "4000"
  PGHOST: "postgres"
  PGPORT: "5432"
  PGDATABASE: "edugestion"
  MONGO_URI: "mongodb://mongo:27017/edugestion_logs"
  JWT_EXPIRES_IN: "8h"
  AUTO_MIGRATE: "true"
---
# Valores sensibles. En un clúster real estos NO se versionan en git:
# se crean con `kubectl create secret generic ... --from-literal=` o se
# gestionan con un vault externo (Sealed Secrets, External Secrets, etc.).
# Este archivo se incluye solo como plantilla de referencia con valores
# de ejemplo para desarrollo local.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: edugestion
type: Opaque
stringData:
  PGUSER: "edugestion"
  PGPASSWORD: "edugestion_pass"
  JWT_SECRET: "change_this_secret_in_production"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: edugestion
type: Opaque
stringData:
  POSTGRES_USER: "edugestion"
  POSTGRES_PASSWORD: "edugestion_pass"
  POSTGRES_DB: "edugestion"
